name: probe pbdb api

on:
  push:
    branches:
      - feature/dino1-acquisition
    paths:
      - .github/workflows/probe-pbdb.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe PBDB reference lookup
        run: |
          python - <<'PY'
          import urllib.request
          urls = [
            "https://paleobiodb.org/data1.2/refs/single.json?id=149",
            "https://paleobiodb.org/data1.2/refs/single.json?id=ref:149",
            "https://paleobiodb.org/data1.2/refs/list.json?ref_id=149&limit=3",
            "https://paleobiodb.org/data1.2/refs/list.json?id=149&limit=3",
            "https://paleobiodb.org/data1.2/refs/list.csv?ref_id=149&limit=3",
          ]
          for url in urls:
              print("\nURL", url)
              req = urllib.request.Request(url, headers={"User-Agent":"Fog-of-Time/0.1"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(8000).decode("utf-8", "replace")
                      print("STATUS", r.status)
                      print(body)
              except Exception as e:
                  if hasattr(e, "read"):
                      try: print("BODY", e.read().decode("utf-8","replace")[:2000])
                      except Exception: pass
                  print("ERROR", type(e).__name__, e)
          PY
