name: probe pbdb api

on:
  push:
    branches:
      - feature/dino1-acquisition
    paths:
      - .github/workflows/probe-pbdb.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe PBDB stratigraphy columns
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://paleobiodb.org/data1.2/occs/list.csv?base_name=Dinosauria&show=coords,loc,ident,refattr,strat&limit=5"
          req = urllib.request.Request(url, headers={"User-Agent":"Fog-of-Time/0.1"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.read(12000).decode("utf-8","replace"))
          PY
